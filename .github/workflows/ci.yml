name: C/C++ CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build essentials
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Find and compile C++ files
        run: |
          set -e
          for f in $(git ls-files '*.cpp' | tr '\n' ' '); do
            echo "Building $f";
            g++ -std=c++11 "$f" -o /tmp/$(basename "$f" .cpp) || exit 1;
          done
